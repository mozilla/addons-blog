version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "daily"
    groups:
      jest:
        patterns:
          - "jest"
          - "jest-environment-jsdom"
      sass-embedded:
        patterns:
          - "sass-embedded"
          - "sass-embedded-*"
    open-pull-requests-limit: 99
    cooldown:
      default-days: 7
    ignore:
      # https://github.com/mozilla/addons-blog/issues/1018
      - dependency-name: eslint
        versions:
          - ">= 10"
      # https://github.com/mozilla/addons-blog/issues/1019
      - dependency-name: string-replace-async
        versions:
          - ">= 3"
      # https://github.com/mozilla/addons-blog/issues/1020
      - dependency-name: posthtml-postcss
        versions:
          - ">= 1"
  - package-ecosystem: "composer"
    directory: "/"
    schedule:
      interval: "daily"
    open-pull-requests-limit: 99
    cooldown:
      default-days: 7
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: daily
    groups:
      ssdlc-actions:
        patterns:
          - "mozilla/ssdlc-actions/*"
    cooldown:
      default-days: 7
    open-pull-requests-limit: 99
